<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Flux Support Inbox</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, Helvetica, sans-serif;
  background: #f5f6f8;
  color: #111827;
}

.app {
  height: 100vh;
  display: grid;
  grid-template-columns: 340px 1fr;
}

.sidebar {
  background: #fff;
  border-right: 1px solid #e5e7eb;
  display: flex;
  flex-direction: column;
  min-width: 0;
}

.brand {
  padding: 22px;
  border-bottom: 1px solid #e5e7eb;
}

.brand-title {
  font-size: 20px;
  font-weight: 700;
}

.brand-subtitle {
  margin-top: 5px;
  color: #6b7280;
  font-size: 13px;
}

.toolbar {
  padding: 12px 16px;
  border-bottom: 1px solid #e5e7eb;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.refresh-button,
.resolve-button,
.send-button {
  border: 0;
  cursor: pointer;
  border-radius: 9px;
  font-weight: 600;
}

.refresh-button {
  padding: 8px 12px;
  background: #eef2f7;
}

.count {
  color: #6b7280;
  font-size: 13px;
}

.conversations {
  overflow-y: auto;
  flex: 1;
}

.conversation {
  padding: 16px;
  cursor: pointer;
  border-bottom: 1px solid #f0f1f3;
}

.conversation:hover {
  background: #f8fafc;
}

.conversation.active {
  background: #eef5ff;
}

.conversation-name {
  font-weight: 700;
  margin-bottom: 4px;
}

.conversation-number {
  color: #6b7280;
  font-size: 13px;
}

.conversation-time {
  color: #9ca3af;
  font-size: 11px;
  margin-top: 6px;
}

.empty-list {
  padding: 30px 20px;
  text-align: center;
  color: #9ca3af;
}

.chat {
  display: flex;
  flex-direction: column;
  min-width: 0;
  height: 100vh;
}

.chat-header {
  min-height: 72px;
  background: #fff;
  border-bottom: 1px solid #e5e7eb;
  padding: 14px 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.chat-name {
  font-weight: 700;
}

.chat-number {
  color: #6b7280;
  font-size: 13px;
  margin-top: 4px;
}

.resolve-button {
  padding: 10px 14px;
  background: #111827;
  color: #fff;
}

.messages {
  flex: 1;
  overflow-y: auto;
  padding: 24px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.message {
  max-width: 72%;
  padding: 11px 14px;
  border-radius: 14px;
  line-height: 1.45;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}

.message.user {
  align-self: flex-start;
  background: #fff;
  border: 1px solid #e5e7eb;
}

.message.assistant {
  align-self: flex-end;
  background: #dbeafe;
}

.message-time {
  margin-top: 5px;
  font-size: 10px;
  color: #9ca3af;
}

.composer {
  background: #fff;
  border-top: 1px solid #e5e7eb;
  padding: 14px;
  display: flex;
  gap: 10px;
}

.composer textarea {
  flex: 1;
  resize: none;
  border: 1px solid #d1d5db;
  border-radius: 10px;
  min-height: 48px;
  max-height: 140px;
  padding: 13px;
  font: inherit;
  outline: none;
}

.composer textarea:focus {
  border-color: #2563eb;
}

.send-button {
  min-width: 88px;
  padding: 0 18px;
  background: #2563eb;
  color: #fff;
}

.placeholder {
  margin: auto;
  text-align: center;
  color: #9ca3af;
}

.auth-overlay {
  position: fixed;
  inset: 0;
  background: rgba(17,24,39,.72);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 100;
}

.auth-box {
  width: min(92vw, 390px);
  background: #fff;
  border-radius: 16px;
  padding: 26px;
}

.auth-box h2 {
  margin-top: 0;
}

.auth-box p {
  color: #6b7280;
  font-size: 14px;
}

.auth-box input {
  width: 100%;
  padding: 12px;
  margin: 10px 0 14px;
  border: 1px solid #d1d5db;
  border-radius: 9px;
  font-size: 16px;
}

.auth-box button {
  width: 100%;
  padding: 12px;
  border: 0;
  border-radius: 9px;
  background: #111827;
  color: #fff;
  font-weight: 700;
  cursor: pointer;
}

.auth-error {
  color: #dc2626 !important;
  min-height: 18px;
}

.hidden {
  display: none !important;
}

@media (max-width: 760px) {
  .app {
    grid-template-columns: 1fr;
  }

  .sidebar {
    position: absolute;
    inset: 0;
    z-index: 20;
  }

  .sidebar.mobile-hidden {
    display: none;
  }

  .chat {
    width: 100%;
  }

  .message {
    max-width: 86%;
  }
}
</style>
</head>

<body>

<div id="authOverlay" class="auth-overlay">
  <div class="auth-box">
    <h2>Flux Support</h2>
    <p>Enter the support inbox password.</p>

    <input
      id="tokenInput"
      type="password"
      placeholder="Support password"
      autocomplete="current-password"
    >

    <p id="authError" class="auth-error"></p>

    <button id="loginButton">Open Inbox</button>
  </div>
</div>

<div class="app">

  <aside id="sidebar" class="sidebar">
    <div class="brand">
      <div class="brand-title">Flux Support</div>
      <div class="brand-subtitle">
        Human Support Inbox
      </div>
    </div>

    <div class="toolbar">
      <span id="conversationCount" class="count">
        0 conversations
      </span>

      <button id="refreshButton" class="refresh-button">
        Refresh
      </button>
    </div>

    <div id="conversationList" class="conversations">
      <div class="empty-list">
        No escalated conversations
      </div>
    </div>
  </aside>

  <main class="chat">

    <div id="chatHeader" class="chat-header hidden">
      <div style="display:flex;align-items:center;gap:10px;">
        <button
          id="backButton"
          class="refresh-button"
          style="display:none;"
        >
          Back
        </button>

        <div>
          <div id="chatName" class="chat-name"></div>
          <div id="chatNumber" class="chat-number"></div>
        </div>
      </div>

      <button id="resolveButton" class="resolve-button">
        Resolve / Return to AI
      </button>
    </div>

    <div id="messages" class="messages">
      <div class="placeholder">
        Select a conversation
      </div>
    </div>

    <div id="composer" class="composer hidden">
      <textarea
        id="replyInput"
        placeholder="Write a reply..."
      ></textarea>

      <button id="sendButton" class="send-button">
        Send
      </button>
    </div>

  </main>

</div>

<script>
let supportToken =
  sessionStorage.getItem('fluxSupportToken') || '';

let conversations = [];
let selectedUserKey = null;

const authOverlay = document.getElementById('authOverlay');
const tokenInput = document.getElementById('tokenInput');
const loginButton = document.getElementById('loginButton');
const authError = document.getElementById('authError');

const listElement =
  document.getElementById('conversationList');

const conversationCount =
  document.getElementById('conversationCount');

const messagesElement =
  document.getElementById('messages');

const chatHeader =
  document.getElementById('chatHeader');

const chatName =
  document.getElementById('chatName');

const chatNumber =
  document.getElementById('chatNumber');

const composer =
  document.getElementById('composer');

const replyInput =
  document.getElementById('replyInput');

const sendButton =
  document.getElementById('sendButton');

const resolveButton =
  document.getElementById('resolveButton');

const refreshButton =
  document.getElementById('refreshButton');

const sidebar =
  document.getElementById('sidebar');

const backButton =
  document.getElementById('backButton');

function apiHeaders(extra = {}) {
  return {
    'Authorization': `Bearer ${supportToken}`,
    ...extra
  };
}

async function api(url, options = {}) {
  options.headers = apiHeaders(options.headers || {});

  const response = await fetch(url, options);

  if (response.status === 401) {
    supportToken = '';
    sessionStorage.removeItem('fluxSupportToken');
    authOverlay.classList.remove('hidden');
    throw new Error('Unauthorized');
  }

  const data = await response.json().catch(() => ({}));

  if (!response.ok) {
    throw new Error(
      data.error || `Request failed: ${response.status}`
    );
  }

  return data;
}

function escapeHtml(value) {
  return String(value || '')
    .replaceAll('&', '&amp;')
    .replaceAll('<', '&lt;')
    .replaceAll('>', '&gt;')
    .replaceAll('"', '&quot;')
    .replaceAll("'", '&#039;');
}

function formatTime(value) {
  if (!value) return '';

  const date = new Date(value);

  if (Number.isNaN(date.getTime())) return '';

  return date.toLocaleString();
}

async function login() {
  const value = tokenInput.value.trim();

  if (!value) {
    authError.textContent = 'Enter the password.';
    return;
  }

  supportToken = value;

  try {
    await loadConversations();

    sessionStorage.setItem(
      'fluxSupportToken',
      supportToken
    );

    tokenInput.value = '';
    authError.textContent = '';
    authOverlay.classList.add('hidden');
  } catch (error) {
    supportToken = '';
    authError.textContent =
      'Incorrect password or server unavailable.';
  }
}

async function loadConversations() {
  const data = await api(
    '/api/admin/whatsapp/escalations'
  );

  conversations =
    Array.isArray(data.conversations)
      ? data.conversations
      : [];

  renderConversationList();

  if (selectedUserKey) {
    const stillExists = conversations.some(
      item => item.user_key === selectedUserKey
    );

    if (!stillExists) {
      clearConversation();
    }
  }
}

function renderConversationList() {
  conversationCount.textContent =
    `${conversations.length} conversation` +
    (conversations.length === 1 ? '' : 's');

  if (!conversations.length) {
    listElement.innerHTML = `
      <div class="empty-list">
        No escalated conversations
      </div>
    `;
    return;
  }

  listElement.innerHTML = conversations.map(item => {
    const name =
      item.display_name ||
      item.phone_number ||
      'WhatsApp User';

    const activeClass =
      selectedUserKey === item.user_key
        ? ' active'
        : '';

    return `
      <div
        class="conversation${activeClass}"
        data-key="${escapeHtml(item.user_key)}"
      >
        <div class="conversation-name">
          ${escapeHtml(name)}
        </div>

        <div class="conversation-number">
          ${escapeHtml(item.phone_number || '')}
        </div>

        <div class="conversation-time">
          Escalated ${escapeHtml(
            formatTime(item.requested_at)
          )}
        </div>
      </div>
    `;
  }).join('');

  document
    .querySelectorAll('.conversation')
    .forEach(element => {
      element.addEventListener('click', () => {
        openConversation(
          element.dataset.key
        );
      });
    });
}

async function openConversation(userKey) {
  selectedUserKey = userKey;

  renderConversationList();

  const data = await api(
    `/api/admin/whatsapp/escalations/${userKey}/messages`
  );

  const conversation = data.conversation || {};
  const messages =
    Array.isArray(data.messages)
      ? data.messages
      : [];

  chatName.textContent =
    conversation.display_name ||
    conversation.phone_number ||
    'WhatsApp User';

  chatNumber.textContent =
    conversation.phone_number || '';

  chatHeader.classList.remove('hidden');
  composer.classList.remove('hidden');

  if (!messages.length) {
    messagesElement.innerHTML = `
      <div class="placeholder">
        No saved messages yet
      </div>
    `;
  } else {
    messagesElement.innerHTML =
      messages.map(message => `
        <div class="message ${
          message.role === 'user'
            ? 'user'
            : 'assistant'
        }">
          <div>
            ${escapeHtml(message.content)}
          </div>

          <div class="message-time">
            ${escapeHtml(
              formatTime(message.created_at)
            )}
          </div>
        </div>
      `).join('');
  }

  messagesElement.scrollTop =
    messagesElement.scrollHeight;

  if (window.innerWidth <= 760) {
    backButton.style.display = 'inline-block';

    requestAnimationFrame(() => {
      sidebar.classList.add('mobile-hidden');
    });
  }
}

function clearConversation() {
  selectedUserKey = null;

  chatHeader.classList.add('hidden');
  composer.classList.add('hidden');

  messagesElement.innerHTML = `
    <div class="placeholder">
      Select a conversation
    </div>
  `;

  renderConversationList();
}

async function sendReply() {
  if (!selectedUserKey) return;

  const text = replyInput.value.trim();

  if (!text) return;

  sendButton.disabled = true;
  replyInput.disabled = true;

  try {
    await api(
      `/api/admin/whatsapp/escalations/${selectedUserKey}/reply`,
      {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({ text })
      }
    );

    replyInput.value = '';

    await openConversation(selectedUserKey);
    await loadConversations();

  } catch (error) {
    alert(error.message);
  } finally {
    sendButton.disabled = false;
    replyInput.disabled = false;
    replyInput.focus();
  }
}

async function resolveConversation() {
  if (!selectedUserKey) return;

  if (
    !confirm(
      'End human support and return this conversation to AI?'
    )
  ) {
    return;
  }

  resolveButton.disabled = true;

  try {
    await api(
      `/api/admin/whatsapp/escalations/${selectedUserKey}/resolve`,
      {
        method: 'POST'
      }
    );

    clearConversation();
    await loadConversations();

    if (window.innerWidth <= 760) {
      sidebar.classList.remove('mobile-hidden');
    }

  } catch (error) {
    alert(error.message);
  } finally {
    resolveButton.disabled = false;
  }
}

loginButton.addEventListener('click', login);

tokenInput.addEventListener('keydown', event => {
  if (event.key === 'Enter') {
    login();
  }
});

refreshButton.addEventListener(
  'click',
  loadConversations
);

sendButton.addEventListener(
  'click',
  sendReply
);

replyInput.addEventListener('keydown', event => {
  if (
    event.key === 'Enter' &&
    !event.shiftKey
  ) {
    event.preventDefault();
    sendReply();
  }
});

backButton.addEventListener('click', () => {
  sidebar.classList.remove('mobile-hidden');
  backButton.style.display = 'none';
});

resolveButton.addEventListener(
  'click',
  resolveConversation
);

if (supportToken) {
  loadConversations()
    .then(() => {
      authOverlay.classList.add('hidden');
    })
    .catch(() => {
      authOverlay.classList.remove('hidden');
    });
}

setInterval(() => {
  if (!supportToken) return;

  loadConversations().catch(() => {});

  if (selectedUserKey) {
    openConversation(selectedUserKey)
      .catch(() => {});
  }
}, 10000);
</script>

</body>
</html>
